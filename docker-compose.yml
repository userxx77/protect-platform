# Production-style stack: Postgres + Redis + API + Worker + Bot + Web
# Single shared network (default Compose network).
#
# Usage:
#   cp .env.example .env   # or ./setup.sh
#   docker compose up -d --build
#
# Startup / "Waiting" on api (healthcheck):
#   1) docker compose logs api --tail 100 — look for api_entrypoint_migrate_retry vs migrate_ok.
#   2) Until /ready returns 200 (DB + Redis), the api container stays "starting".
#   3) Wrong REDIS_URL/auth → /ready 503 until healthcheck fails — fix .env.
#
# Migrations: the `migrate` one-shot service runs prisma migrate deploy before api/worker start.
# API sets SKIP_PRISMA_MIGRATE=1 so it does not re-run migrate in the entrypoint.
# Local infra only: docker compose up -d postgres redis

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-protect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protect}
      POSTGRES_DB: ${POSTGRES_DB:-protect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./infra/redis/docker-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-protect}:${POSTGRES_PASSWORD:-protect}@postgres:5432/${POSTGRES_DB:-protect}
    entrypoint:
      ["/bin/sh", "-c", "cd /repo/apps/api && npx prisma migrate deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-protect}:${POSTGRES_PASSWORD:-protect}@postgres:5432/${POSTGRES_DB:-protect}
      NODE_ENV: production
      API_PORT: "3001"
      TICKET_UPLOAD_DIR: /data/ticket-uploads
      SKIP_PRISMA_MIGRATE: "1"
    volumes:
      - ticket_uploads:/data/ticket-uploads
    ports:
      - "${API_PUBLISH_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.API_PORT||3001)+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-protect}:${POSTGRES_PASSWORD:-protect}@postgres:5432/${POSTGRES_DB:-protect}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Optional: public dashboard link for /help (also in .env as WEB_URL)
      WEB_URL: ${WEB_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_BASE_URL: http://api:3001
    ports:
      - "${WEB_PUBLISH_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      bot:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata: {}
  ticket_uploads: {}

# Override service URLs for Docker: set DATABASE_URL / REDIS_URL in .env to hosts
# `postgres` / `redis` (setup.sh writes these). Compose also forces DATABASE_URL
# for api/worker from POSTGRES_* above; pass REDIS_URL in .env for each service.
